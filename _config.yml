# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: 零启
subtitle: AI · Code · Projects
description: zerogo 的个人博客，记录 AI 实践、Web 开发、项目复盘与长期学习。
keywords:
  - AI
  - Hexo
  - Butterfly
  - Web
  - zerogo
author: zerogo
language: zh-CN
timezone: Asia/Shanghai

# URL
## This repository is configured as a GitHub Pages project site.
## If you bind a custom domain or rename the repo to zerogo525.github.io, update url/root.
url: https://zerogo525.github.io/zerogo.github.io
root: /zerogo.github.io/
permalink: posts/:abbrlink/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true

# Code Highlight
syntax_highlighter: prismjs
highlight:
  enable: false
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page
index_generator:
  path: blog
  per_page: 10
  order_by: -date

# Category & Tag
default_category: 技术
category_map:
tag_map:

# Metadata
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Theme
theme: butterfly

# SEO
nofollow:
  enable: true
  exclude:
    - zerogo525.github.io

# RSS
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit: 280
  content_limit_delim: ' '
  order_by: -date

# Sitemap
sitemap:
  path: sitemap.xml

# Local search data for Butterfly
search:
  path: search.xml
  field: post
  content: true
  format: html

# Deployment
deploy:
  type: git
  repo: https://github.com/zerogo525/zerogo.github.io.git
  branch: main
